apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/farahcherif1/gitops-tp4.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  syncPolicy:
    automated:
      prune: true       # supprime du cluster ce qui est supprimé de Git
      selfHeal: true    # annule les modifications manuelles (obligatoire dans le TP)
    syncOptions:
      - CreateNamespace=true